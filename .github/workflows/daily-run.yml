name: Daily Crypto News Digest

on:
  schedule:
    # Runs every 3 hours (00:00, 03:00, 06:00 UTC etc.)
    # = 5:30 AM, 8:30 AM, 11:30 AM, 2:30 PM, 5:30 PM, 8:30 PM, 11:30 PM, 2:30 AM Sri Lanka time.
    - cron: "0 */3 * * *"
  workflow_dispatch: {} # lets you manually trigger a run from the Actions tab

permissions:
  contents: write # needed so the workflow can save state.json back to the repo

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node index.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Saves which events have already been notified about, so the next run doesn't
      # repeat them. Runs even if the step above fails partway, so any progress made
      # before a failure is still saved. Only commits if state.json actually changed.
      - name: Save notification state
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || git commit -m "Update notification state [skip ci]"
            git push
          else
            echo "No state.json yet — nothing to save."
          fi
