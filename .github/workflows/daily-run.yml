name: Daily Crypto News Digest

on:
  schedule:
    # Runs at 01:00 UTC = 06:30 Sri Lanka time (UTC+5:30). Adjust as needed.
    - cron: "0 1 * * *"
  workflow_dispatch: {} # lets you manually trigger a run from the Actions tab

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node index.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
